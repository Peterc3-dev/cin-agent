[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cin-agent"
version = "0.1.0"
description = "ThinkCentre-resident Telegram agent: conversation plus safe shell execution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=20.0,<22",
    "httpx>=0.24,<1.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[tool.setuptools]
# Flat layout: the modules live at the repository root.
py-modules = [
    "telegram_bot",
    "command_parser",
    "shell_ghost",
    "memory",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
# Scope test collection to the unit tests added in this branch. These cover
# the pure-logic helpers only and pull in no heavy/runtime-only dependencies
# (no telegram, httpx, GPU, or model weights).
testpaths = ["tests"]
